name: ci

# The JavaScript suites, the two end-to-end scripts, and the .NET gate split
# across two jobs: `verify` carries the formatter, the build, the unit and
# architecture suites and the python tooling tests; `integration` carries the
# Testcontainers suites (PostGIS, SQL Server, the host). The split is read off
# each project's own `PackageReference`s — a suite that takes a
# `Testcontainers*` package starts a container, so it needs a runner of its
# own — by `tools/verify_scope.py`, not kept as a hand-maintained list
# (SpatialEngine-0dx).
# Together they are what `eng/verify.sh --full` runs, and since ADR-0134 that
# is where the exhaustive gate lives: the merge gate itself is the scoped fast
# lane (`eng/verify.sh --fast`), because at hundreds of merges a day a
# 15–25 minute gate is the price of every merge rather than signal. So this
# workflow is the detector that follows every merge — the formatter, every test
# project, and a red run on `main` — rather than the thing standing in front of
# it. The lanes are implemented in ADR-0109 and the contract is ADR-0118 as
# amended by ADR-0134. `main` has no branch protection and this job is red on
# every push, so nothing here blocks anything yet. A bare `eng/verify.sh` under
# `CI=true` runs the full lane anyway, so the next workflow that calls the
# script without a lane does not silently get the scoped one; the split below
# is the deliberate exception and spells out the steps each job owns.
# PostGIS integration runs here because GitHub's Linux runners provide Docker
# (Testcontainers) and the same boxes are not contended by eight agents.
# `eng/verify.sh --full` is still runnable locally — `--bead <id> --full` asks
# the merge tool for it — and these jobs spell its steps out because one job
# cannot run half a script.
on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes an in-flight run for the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  verify:
    name: verify (format · build · unit · architecture · tooling)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Toolchain
        run: dotnet --info

      # The formatter is scoped per project in `eng/verify.sh --format` (~45 s
      # each) and whole-solution here. On a pull request the whole solution is
      # ~11 minutes on a runner nobody else is on, and it is the step that has
      # to be exactly what a local `--full` runs.
      - name: Format check
        run: dotnet format SpatialEngine.slnx --verify-no-changes

      # `dotnet format` does not enforce `trim_trailing_whitespace` on a
      # comment-only line, so the rule the .editorconfig claims for `[*]` is
      # checked here rather than through the formatter. This job spells its
      # steps out rather than calling `eng/verify.sh`, so without the step
      # below the detector that follows every merge keeps the hole the lanes
      # closed (ADR-0143).
      - name: Trailing whitespace
        run: python3 tools/trailing_whitespace.py

      # The rule used to be a `tools/test_*.py`, which only ran when the change
      # set touched `tools/**`, so the fast merge gate never read it and a
      # `<<<<<<< HEAD` line reached `CHANGELOG.md` on main through a docs merge
      # (SpatialEngine-u2x.37). The lanes call `tools/conflict_markers.py`
      # directly (ADR-0146); this job spells its steps out rather than calling
      # the script, so it carries the step too.
      - name: Conflict markers
        run: python3 tools/conflict_markers.py

      # The root of the repository is the first thing every agent's file listing
      # has to reason past, and a `HANDOFF.md` and a 1384-line `CHANGELOG.md`
      # sat there for a month and a half (ADR-0148). The changelog is a release
      # artefact at `docs/CHANGELOG.md` and in-flight state is the bead queue, so
      # the lanes call this check directly rather than leaving it to the tooling
      # suite, which only runs when the change set touches `tools/**`.
      - name: Doc surface
        run: python3 tools/doc_surface.py

      # The release section of `docs/CHANGELOG.md` is generated from the
      # `Task:` trailers and the narrative the work commits carry, once per
      # release (`RELEASING.md` step 3), because a merge-scoped generated
      # section would be a `--write` and a red lane on every merge (ADR-0173).
      # What the lanes can gate is the hand-merge that rotted: 1038 lines of it,
      # edited across 107 merges by no rule. Hand-merging is a `docs` change,
      # so this job spells the step out rather than trusting the tooling suite.
      - name: Changelog
        run: python3 tools/changelog.py --check

      # The bead protocol — a closed bead's merge commit carries `Task: <id>`,
      # and a change to `src/Spatial.Contracts/**` or `src/Spatial.Core/**`
      # lands its decision record with it — was prose in AGENTS.md and the
      # runbook, and it had already failed in-tree: three workers each read a
      # body naming bead `.2` while working `.1`, `.3` and `.4`
      # (SpatialEngine-imz.4, ADR-0152). The lanes call
      # `tools/beads_gate.py` directly; this job spells out its steps rather
      # than calling `eng/verify.sh`, so it carries the step too. The bead queue
      # is local coordination state in the shared git dir and a runner has none,
      # so the step passes `--no-queue`: check 1 is reported as not judged
      # rather than read, and the wall check still runs.
      - name: Bead protocol and ADR wall
        run: python3 tools/beads_gate.py --root . --base origin/main --no-queue

      - name: Build
        run: dotnet build SpatialEngine.slnx

      # The unit lane is every test project outside tests/integration, listed
      # from the solution itself so a new project cannot be forgotten here.
      - name: Unit and architecture tests
        run: |
          set -euo pipefail
          for project in $(python3 tools/verify_scope.py --list lane --lane unit); do
            dotnet test "$project" --no-build
          done

      - name: Python tooling tests
        run: python3 -m unittest discover --start-directory tools --pattern 'test_*.py'

  integration:
    name: integration (host · postgis · sqlserver)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build SpatialEngine.slnx

      # The container-backed half of the flat gate, on its own runner: these
      # are the suites that start Testcontainers, so they need a box of their
      # own rather than a share of one that is already running 22 test
      # projects. Together with the `verify` job this is the same set of
      # projects `dotnet test SpatialEngine.slnx` runs.
      - name: Host and store suites
        run: |
          set -euo pipefail
          for project in $(python3 tools/verify_scope.py --list lane --lane integration); do
            dotnet test "$project" --no-build
          done

  web:
    name: web (sdk drift · unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            clients/typescript/package-lock.json
            apps/workbench-web/package-lock.json
            tests/end-to-end-web/package-lock.json

      - name: TypeScript SDK (typecheck · generated drift · unit)
        run: |
          npm ci --prefix clients/typescript
          npm test --prefix clients/typescript

      - name: Workbench (typecheck · unit)
        run: |
          npm ci --prefix apps/workbench-web
          npm test --prefix apps/workbench-web

  e2e:
    name: e2e (host · sdk · browser)
    runs-on: ubuntu-latest
    needs: [verify, integration]
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            clients/typescript/package-lock.json
            apps/workbench-web/package-lock.json
            tests/end-to-end-web/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/end-to-end-web/package-lock.json') }}

      - name: Host + TypeScript SDK over real HTTP
        run: ./eng/e2e-web.sh

      # `e2e-web.sh` regenerates the OpenAPI snapshot and the SDK wire types
      # from the live host; any diff means the committed artifacts lag the
      # contracts the host actually serves.
      - name: Fail on API/SDK drift
        run: git diff --exit-code -- clients/typescript

      - name: Host + built workbench in a real browser
        run: ./eng/workbench-e2e.sh

      - name: Spatial CLI against the real host
        run: ./eng/cli-e2e.sh
