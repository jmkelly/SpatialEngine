name: ci

# The one-command gate (`eng/verify.sh`) plus the JavaScript suites and both
# end-to-end scripts, so a clean checkout is verified the same way a developer
# verifies locally. PostGIS integration runs here because GitHub's Linux
# runners provide Docker (Testcontainers).
on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes an in-flight run for the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  verify:
    name: verify (format · build · tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Toolchain
        run: dotnet --info

      - name: Verify
        run: ./eng/verify.sh

  web:
    name: web (sdk drift · unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            clients/typescript/package-lock.json
            apps/workbench-web/package-lock.json
            tests/end-to-end-web/package-lock.json

      - name: TypeScript SDK (typecheck · generated drift · unit)
        run: |
          npm ci --prefix clients/typescript
          npm test --prefix clients/typescript

      - name: Workbench (typecheck · unit)
        run: |
          npm ci --prefix apps/workbench-web
          npm test --prefix apps/workbench-web

  e2e:
    name: e2e (host · sdk · browser)
    runs-on: ubuntu-latest
    needs: [verify]
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            clients/typescript/package-lock.json
            apps/workbench-web/package-lock.json
            tests/end-to-end-web/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/end-to-end-web/package-lock.json') }}

      - name: Host + TypeScript SDK over real HTTP
        run: ./eng/e2e-web.sh

      # `e2e-web.sh` regenerates the OpenAPI snapshot and the SDK wire types
      # from the live host; any diff means the committed artifacts lag the
      # contracts the host actually serves.
      - name: Fail on API/SDK drift
        run: git diff --exit-code -- clients/typescript

      - name: Host + built workbench in a real browser
        run: ./eng/workbench-e2e.sh
