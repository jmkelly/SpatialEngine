# Demo-upload PostGIS seed (T-t3x.4). `init.sql` is generated by
# `../scripts/build.py --step postgis`: DROP + re-seed of `world_lakes`
# (EPSG:4269) and `us_states` (EPSG:5070). Credentials match the PostGIS
# layer URIs stored in `../demo-upload.qgz`.
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 5s
      timeout: 3s
      retries: 10
